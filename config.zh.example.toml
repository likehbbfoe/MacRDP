# macrdp 服务端配置文件
# 将此文件复制为 config.toml 并根据需要修改
# 配置文件搜索顺序: ./config.toml → ~/.config/macrdp/ → ~/Library/Application Support/macrdp/

# ─── 网络 ─────────────────────────────────────────────────────────────────────

# 监听端口
# 默认值: 3389 (RDP 标准端口)
# 可选值: 任意有效端口号 (建议 1024-65535)
port = 13389

# ─── 认证 ─────────────────────────────────────────────────────────────────────

# RDP 登录凭据 (NLA/Hybrid/CredSSP 认证)
# 启动前设置两个字段；请勿使用下方占位密码。
username = "admin"
password = "CHANGE_ME"

# ─── 显示 ─────────────────────────────────────────────────────────────────────

# 分辨率宽度 (像素)
# 默认值: 0 (自动检测 macOS 显示器分辨率, 并跟随客户端请求)
# 设置具体值 (如 1920) 则强制使用固定分辨率, 忽略客户端请求
width = 0

# 分辨率高度 (像素)
# 默认值: 0 (自动检测 macOS 显示器分辨率, 并跟随客户端请求)
# 设置具体值 (如 1080) 则强制使用固定分辨率, 忽略客户端请求
height = 0

# 目标帧率
# 默认值: 60
# 可选值: 1-120（旧机器可从 15 或 30 开始）
frame_rate = 60

# 目标码率 (Mbps, 默认: 根据分辨率/帧率/质量自动计算)
# 范围: 1-1000；省略时自动选择，编码目标可随网络状态调整。
# bitrate_mbps = 50

# 最终采集分辨率
# 默认值: "auto"（在基础宽高上应用显示器缩放）
# 显式尺寸决定最终采集大小，包括 Retina 显示器。
# 继续兼容旧的缩放字符串 "1" 至 "4"。
# 每边最大 8192 像素，总像素不超过 7680x4320。
# resolution = "1920x1080"

# ─── 编码 ─────────────────────────────────────────────────────────────────────

# 视频质量预设
# 默认值: high_quality
# 可选值:
#   "low_latency"  — 较低自动码率 (1080p30 约 16 Mbps)
#   "balanced"     — 平衡画质与码率 (1080p30 约 33 Mbps)
#   "high_quality" — 较高自动码率 (1080p30 约 50 Mbps)
quality = "high_quality"

# H.264 编码器选择
# 默认值: auto
# 可选值:
#   "software"  — OpenH264 软件编码 (CPU)，支持 P 帧；性能取决于工作负载
#   "hardware"  — VideoToolbox 媒体硬件编码；延迟取决于设备，仅 macOS
#   "auto"      — 优先使用可用硬件，初始化失败后回退软件
encoder = "auto"

# 色度采样模式
# 默认值: avc420
# 可选值:
#   "avc420" — 标准 YUV 4:2:0 色度采样 (需要支持 AVC 的 RDP 客户端)
#   "avc444" — 完整 YUV 4:4:4 色度, 通过双流 AVC444 传输 (需要协商得到 AVC444 支持)
# chroma_mode = "avc420"

# ─── TLS 证书 ──────────────────────────────────────────────────────────────────

# TLS 证书文件路径 (PEM 格式)
# 默认值: 自动生成自签名证书
# cert_path = "/path/to/cert.pem"

# TLS 私钥文件路径 (PEM 格式)
# 默认值: 随证书一起自动生成
# key_path = "/path/to/key.pem"

# ─── 日志 ─────────────────────────────────────────────────────────────────────

# 日志级别
# 默认值: info
# 可选值: trace, debug, info, warn, error
log_level = "info"

# 更改采集或编码选项后，重新启动服务并重新连接。
# 不支持 AVC 的客户端使用协商后的位图传输（Fast-Path，32 位色深）。
