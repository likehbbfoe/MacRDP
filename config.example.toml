# macrdp server configuration
# Copy this file to config.toml and modify as needed.
# Config search order: ./config.toml → ~/.config/macrdp/ → ~/Library/Application Support/macrdp/

# ─── Network ───────────────────────────────────────────────────────────────────

# TCP port to listen on
# Default: 3389 (standard RDP port)
# Options: any valid port number (1024-65535 recommended)
port = 13389

# ─── Authentication ────────────────────────────────────────────────────────────

# RDP login credentials (NLA/Hybrid/CredSSP)
# Set both fields before starting the server; do not use this placeholder password.
username = "admin"
password = "CHANGE_ME"

# ─── Display ───────────────────────────────────────────────────────────────────

# Resolution width in pixels
# Default: 0 (auto-detect from macOS display + follow client request)
# Set to a specific value (e.g. 1920) to force a fixed resolution
width = 0

# Resolution height in pixels
# Default: 0 (auto-detect from macOS display + follow client request)
# Set to a specific value (e.g. 1080) to force a fixed resolution
height = 0

# Target frame rate
# Default: 60
# Options: 1-120 (15 or 30 recommended for older hardware)
frame_rate = 60

# Target bitrate in Mbps (default: auto-calculated from resolution/fps/quality)
# Range: 1-1000. Omit for automatic selection.
# The encoder target may be adjusted for network conditions.
# bitrate_mbps = 50

# Final capture resolution
# Default: "auto" (uses the display scale with the base width/height)
# Use explicit dimensions to select the final size, including on Retina displays.
# Legacy scale strings "1" through "4" remain accepted.
# Maximum: 8192 pixels per side and 7680x4320 total pixels.
# resolution = "1920x1080"

# ─── Encoding ──────────────────────────────────────────────────────────────────

# Video quality preset
# Default: high_quality
# Options:
#   "low_latency"  — lower automatic bitrate (~16 Mbps @ 1080p30)
#   "balanced"     — moderate quality and bitrate (~33 Mbps @ 1080p30)
#   "high_quality" — higher automatic bitrate (~50 Mbps @ 1080p30)
quality = "high_quality"

# H.264 encoder selection
# Default: auto
# Options:
#   "software"  — OpenH264 (CPU), full P-frame support; performance depends on the workload
#   "hardware"  — VideoToolbox media hardware; actual latency depends on the machine
#   "auto"      — prefer hardware, fall back to software
encoder = "auto"

# Chroma subsampling mode
# Default: avc420
# Options:
#   "avc420" — standard YUV 4:2:0 (requires an AVC-capable RDP client)
#   "avc444" — full YUV 4:4:4 via dual-stream AVC444 (requires negotiated AVC444 support)
# chroma_mode = "avc420"

# ─── TLS ───────────────────────────────────────────────────────────────────────

# Path to TLS certificate file (PEM format)
# Default: auto-generated self-signed certificate
# cert_path = "/path/to/cert.pem"

# Path to TLS private key file (PEM format)
# Default: auto-generated alongside certificate
# key_path = "/path/to/key.pem"

# ─── Logging ───────────────────────────────────────────────────────────────────

# Log level
# Default: info
# Options: trace, debug, info, warn, error
log_level = "info"

# Restart the service and reconnect after changing capture or encoding options.
# Clients without AVC use negotiated bitmap transport (Fast-Path, 32-bit color).
